name: Performance characterization

on:
  workflow_dispatch:
    inputs:
      mode:
        description: PostgreSQL server mode
        required: true
        default: owned
        type: choice
        options:
          - owned
          - external
      samples:
        description: Independent samples
        required: true
        default: "3"
        type: string
      representative_rows:
        description: Representative fixture rows
        required: true
        default: "50000"
        type: string
      concurrency:
        description: Simultaneous database leases
        required: true
        default: "4"
        type: string
      concurrent_operations:
        description: Total bounded-concurrent lifecycles
        required: true
        default: "8"
        type: string
      downstream_pool_size:
        description: Eager downstream connections per measured lease
        required: true
        default: "10"
        type: string
      prewarm_databases:
        description: Ready databases in each measured prewarm queue
        required: true
        default: "4"
        type: string
      connection_budget:
        description: Harness downstream-connection permits
        required: true
        default: "120"
        type: string
      connections_per_database:
        description: Permits reserved by each live lease
        required: true
        default: "11"
        type: string
      drain_databases:
        description: Pre-created leases in cleanup-drain phases
        required: true
        default: "4"
        type: string

permissions:
  contents: read

concurrency:
  group: performance-${{ github.repository }}-${{ inputs.mode }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  POSTGRES_TEST_IMAGE: postgres:18
  PTH_PERF_OUTPUT: target/performance.json
  PTH_PERF_SAMPLES: ${{ inputs.samples }}
  PTH_PERF_REPRESENTATIVE_ROWS: ${{ inputs.representative_rows }}
  PTH_PERF_CONCURRENCY: ${{ inputs.concurrency }}
  PTH_PERF_CONCURRENT_OPERATIONS: ${{ inputs.concurrent_operations }}
  PTH_PERF_DOWNSTREAM_POOL_SIZE: ${{ inputs.downstream_pool_size }}
  PTH_PERF_PREWARM_DATABASES: ${{ inputs.prewarm_databases }}
  PTH_PERF_CONNECTION_BUDGET: ${{ inputs.connection_budget }}
  PTH_PERF_CONNECTIONS_PER_DATABASE: ${{ inputs.connections_per_database }}
  PTH_PERF_DRAIN_DATABASES: ${{ inputs.drain_databases }}

jobs:
  benchmark:
    name: ${{ inputs.mode }} PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Cache owned image
        if: inputs.mode == 'owned'
        run: docker pull "$POSTGRES_TEST_IMAGE"

      - name: Run owned characterization
        if: inputs.mode == 'owned'
        run: cargo run --locked --release --example performance

      - name: Run external characterization
        if: inputs.mode == 'external'
        env:
          POSTGRES_TEST_ADMIN_URL: ${{ secrets.POSTGRES_TEST_ADMIN_URL }}
          PTH_PERF_EXTERNAL_IMAGE_CONTENT_ID: ${{ vars.PTH_PERF_EXTERNAL_IMAGE_CONTENT_ID }}
          PTH_PERF_EXTERNAL_STORAGE_DRIVER: ${{ vars.PTH_PERF_EXTERNAL_STORAGE_DRIVER }}
        run: |
          if [[ -z "$POSTGRES_TEST_ADMIN_URL" ]]; then
            echo "::error::The external benchmark requires the POSTGRES_TEST_ADMIN_URL repository secret."
            exit 1
          fi
          cargo run --locked --release --example performance

      - name: Publish run summary
        if: ${{ hashFiles('target/performance.json') != '' }}
        run: |
          jq -r '
            "## Performance characterization (`" + .environment.mode + "`)",
            "",
            "PostgreSQL: `" + .environment.postgres_version + "`  ",
            "PostgreSQL settings: `fsync=" + (.environment.postgres_settings.fsync | tostring)
              + ", synchronous_commit=" + .environment.postgres_settings.synchronous_commit
              + ", full_page_writes=" + (.environment.postgres_settings.full_page_writes | tostring)
              + ", data_checksums=" + (.environment.postgres_settings.data_checksums | tostring)
              + ", wal_level=" + .environment.postgres_settings.wal_level
              + ", max_connections=" + (.environment.postgres_settings.max_connections | tostring)
              + ", reserved_connections=" + (.environment.postgres_settings.reserved_connections | tostring)
              + ", superuser_reserved_connections=" + (.environment.postgres_settings.superuser_reserved_connections | tostring) + "`  ",
            "Connection policy: `budget=" + (.configuration.connection_budget | tostring)
              + ", per_database=" + (.configuration.connections_per_database | tostring)
              + ", max_leases=" + (.configuration.max_simultaneous_leases | tostring)
              + ", downstream_pool_size=" + (.configuration.downstream_pool_size | tostring)
              + ", prewarm_databases=" + (.configuration.prewarm_databases | tostring) + "`  ",
            "Image content ID: `" + (.environment.image_content_id.value // "not reported") + "`  ",
            "Storage: `" + (.environment.storage_driver.value // "not reported") + "`  ",
            "Owned profile: `" + (
              if .configuration.owned_container_profile == null then "not applied"
              elif .configuration.owned_container_profile.storage.kind == "tmpfs" then
                "initdb_no_sync=" + (.configuration.owned_container_profile.initdb_no_sync | tostring)
                  + ", tmpfs_size_bytes=" + (.configuration.owned_container_profile.storage.size_bytes | tostring)
              else
                "initdb_no_sync=" + (.configuration.owned_container_profile.initdb_no_sync | tostring)
                  + ", image_default_storage"
              end
            ) + "`  ",
            "Deferred completion observation: awaited bounded cleanup drain (guarded by `"
              + (.configuration.deferred_drain_timeout_ms | tostring) + " ms`)  ",
            "",
            "| Metric | Fixture | Min ms | Median ms | Mean ms | Max ms |",
            "| --- | --- | ---: | ---: | ---: | ---: |",
            (.summary[] | "| " + .metric + " | " + (.fixture // "all") + " | "
              + ((.min_ns / 1000000) | tostring) + " | "
              + ((.median_ns / 1000000) | tostring) + " | "
              + ((.mean_ns / 1000000) | tostring) + " | "
              + ((.max_ns / 1000000) | tostring) + " |")
          ' target/performance.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('target/performance.json') != '' }}
        with:
          name: postgres-test-harness-performance-${{ inputs.mode }}
          path: target/performance.json
          if-no-files-found: error
