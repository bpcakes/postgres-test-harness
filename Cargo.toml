[package]
name = "postgres-test-harness"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Reusable PostgreSQL test servers, templates, isolated databases, and cleanup"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bpcakes/postgres-test-harness"
documentation = "https://docs.rs/postgres-test-harness"
keywords = ["postgres", "testing", "testcontainers", "database"]
categories = ["development-tools::testing", "database"]
exclude = ["/.beads/**", "/.github/**", "/AGENTS.md"]

[features]
default = ["containers"]
containers = ["dep:libc", "dep:testcontainers"]

[dependencies]
libc = { version = "0.2", optional = true }
sha2 = "0.11"
testcontainers = { version = "0.27.3", default-features = false, features = ["blocking", "ring", "watchdog"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-postgres = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
